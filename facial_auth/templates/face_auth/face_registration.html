<script>
(function() {
    var saved = localStorage.getItem('nc-theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
})();
</script>

<div class="biometric-auth-container">
    <button type="button" id="nc-theme-toggle" class="nc-theme-toggle" aria-label="Changer de thème">☀</button>

    <div class="glassmorphism-card">
        <div class="auth-header">
            <div class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
                </svg>
                <span>NOCONTACT</span>
            </div>
            <h2 class="auth-title">Créer un compte</h2>
            <p class="auth-subtitle">Rejoignez notre plateforme sécurisée</p>
        </div>

        <form id="registerForm" class="auth-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="email" class="form-label">Adresse email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="exemple@domaine.com" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label class="form-label">Authentification faciale</label>
                <div class="biometric-scanner">
                    <div class="scanner-animation">
                        <video id="registerVideo" class="webcam-feed" autoplay playsinline></video>
                        <div class="face-outline">
                            <div class="scanning-beam"></div>
                        </div>
                        <span class="nc-corner tl"></span>
                        <span class="nc-corner tr"></span>
                        <span class="nc-corner bl"></span>
                        <span class="nc-corner br"></span>
                    </div>
                    <canvas id="registerCanvas" style="display:none;"></canvas>
                    <center><button type="button" id="captureBtn" class="neu-button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                            <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                            <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                            <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                        </svg>
                        Capturer l'image
                    </button></center>
                    <p class="webcam-hint">Assurez-vous que votre visage est bien éclairé et visible</p>
                </div>
            </div>

            <button type="submit" class="neu-button btn-block">S'inscrire</button>
        </form>

        <div class="auth-footer">
            <p>Vous avez déjà un compte ? <a href="{% url 'facial_auth:login' %}" class="auth-link">Se connecter</a></p>
        </div>

        <div id="registerStatus" class="status-message"></div>
    </div>

    <div class="particles-container" id="particles-js"></div>

    <div class="nc-credit">développé par <strong>Rimeh Abidi</strong></div>
</div>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<script>
console.log("Initialisation du script d'inscription");

function ncSetToggleIcon(theme) {
    const btn = document.getElementById('nc-theme-toggle');
    if (btn) btn.textContent = theme === 'light' ? '☾' : '☀';
}

document.addEventListener('DOMContentLoaded', () => {
    const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
    ncSetToggleIcon(currentTheme);

    const toggle = document.getElementById('nc-theme-toggle');
    if (toggle) {
        toggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
            const next = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('nc-theme', next);
            ncSetToggleIcon(next);
            if (window.pJSDom && window.pJSDom[0]) {
                const c = next === 'light' ? '#1B2438' : '#ffffff';
                window.pJSDom[0].pJS.particles.color.value = c;
                window.pJSDom[0].pJS.particles.line_linked.color = c;
                window.pJSDom[0].pJS.fn.particlesRefresh();
            }
        });
    }

    if (typeof particlesJS !== 'undefined') {
        const particleColor = currentTheme === 'light' ? '#1B2438' : '#ffffff';
        particlesJS('particles-js', {
            particles: {
                number: { value: 40, density: { enable: true, value_area: 800 } },
                color: { value: particleColor },
                opacity: { value: 0.25, random: true },
                size: { value: 2, random: true },
                line_linked: { enable: true, distance: 150, color: particleColor, opacity: 0.1, width: 1 },
                move: { enable: true, speed: 1, direction: "none", random: true, straight: false, out_mode: "out" }
            }
        });
    }

    const scanningBeam = document.querySelector('.scanning-beam');
    if (scanningBeam) {
        setInterval(() => {
            scanningBeam.style.top = '100%';
            setTimeout(() => {
                scanningBeam.style.transition = 'none';
                scanningBeam.style.top = '-10%';
                setTimeout(() => {
                    scanningBeam.style.transition = 'top 2s linear';
                }, 50);
            }, 2000);
        }, 2500);
    }

    initWebcam();
});

const video = document.getElementById('registerVideo');
const canvas = document.getElementById('registerCanvas');
const ctx = canvas.getContext('2d');
let stream = null;

async function initWebcam() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                width: { ideal: 1280 },
                height: { ideal: 720 },
                facingMode: 'user'
            }
        });
        video.srcObject = stream;
        console.log("Webcam initialisée avec succès");
    } catch (err) {
        console.error("Erreur webcam:", err);
        showStatusMessage(`Erreur d'accès à la webcam: ${err.message}`, 'error');
    }
}

document.getElementById('captureBtn').addEventListener('click', () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);

    showToast('Image capturée avec succès', 'success');

    document.querySelector('.scanner-animation').classList.add('captured');
    setTimeout(() => {
        document.querySelector('.scanner-animation').classList.remove('captured');
    }, 500);
});

document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    console.log("Tentative d'envoi du formulaire");

    showStatusMessage('Validation de votre inscription en cours...', 'info');

    try {
        const formData = new FormData(e.target);
        formData.append('face_image', canvas.toDataURL('image/jpeg', 0.8));

        const response = await fetch('/register/', {
            method: 'POST',
            body: formData,
            headers: {
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
                'Accept': 'application/json'
            }
        });

        const result = await response.json();
        console.log("Réponse du serveur:", result);

        if (result.redirect) {
            showStatusMessage('Inscription réussie! Redirection...', 'success');
            setTimeout(() => window.location.href = result.redirect, 1500);
        } else {
            showStatusMessage(result.error || 'Erreur lors de la création du compte', 'error');
        }
    } catch (error) {
        console.error("Erreur:", error);
        showStatusMessage('Erreur de connexion au serveur', 'error');
    }
});

function showStatusMessage(message, type) {
    const statusDiv = document.getElementById('registerStatus');
    statusDiv.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
    statusDiv.style.display = 'block';
}

function showToast(message, type) {
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.textContent = message;
    document.body.appendChild(toast);

    setTimeout(() => {
        toast.classList.add('fade-out');
        setTimeout(() => toast.remove(), 500);
    }, 3000);
}
</script>

<style>
:root {
    --nc-void:      #0B1220;
    --nc-panel:     #121A2C;
    --nc-panel-hi:  #172036;
    --nc-line:      #253150;
    --nc-text:      #E7ECF5;
    --nc-muted:     #7C88A6;
    --nc-scan:      #4FD1C5;
    --nc-scan-dim:  rgba(79, 209, 197, 0.12);
    --nc-danger:    #E5555F;
    --nc-success:   #4ad66d;
}
:root[data-theme="light"] {
    --nc-void:      #F4F6FA;
    --nc-panel:     #FFFFFF;
    --nc-panel-hi:  #EEF2F8;
    --nc-line:      #DBE1EC;
    --nc-text:      #101A2E;
    --nc-muted:     #5B6785;
    --nc-scan:      #0E8C82;
    --nc-scan-dim:  rgba(14, 140, 130, 0.10);
    --nc-danger:    #C23A43;
    --nc-success:   #1F9254;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
}

body {
    background: var(--nc-void);
    color: var(--nc-text);
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.2s ease, color 0.2s ease;
}

.biometric-auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    position: relative;
    padding: 2rem;
}

.nc-theme-toggle {
    position: fixed;
    top: 1.25rem;
    right: 1.25rem;
    font-size: 0.95rem;
    color: var(--nc-text);
    background: var(--nc-panel);
    border: 1px solid var(--nc-line);
    border-radius: 8px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 20;
    transition: border-color 0.15s ease;
}
.nc-theme-toggle:hover { border-color: var(--nc-scan); }

.glassmorphism-card {
    background: var(--nc-panel);
    border-radius: 16px;
    border: 1px solid var(--nc-line);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    width: 100%;
    max-width: 500px;
    padding: 2.5rem;
    z-index: 10;
    animation: fadeInUp 0.6s ease;
}

.auth-header { text-align: center; margin-bottom: 1.6rem; }

.logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    margin-bottom: 1.2rem;
}
.logo svg { width: 24px; height: 24px; fill: var(--nc-scan); }
.logo span {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.02em;
}

.auth-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.5rem;
    margin-bottom: 0.4rem;
    font-weight: 600;
    color: var(--nc-text);
}

.auth-subtitle {
    color: var(--nc-muted);
    font-size: 0.9rem;
}

.auth-form {
    display: flex;
    flex-direction: column;
    gap: 1.3rem;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
}

.form-label {
    font-weight: 500;
    color: var(--nc-text);
    font-size: 0.88rem;
}

.form-control {
    padding: 0.7rem 0.9rem;
    background: var(--nc-panel-hi);
    border: 1px solid var(--nc-line);
    border-radius: 10px;
    color: var(--nc-text);
    font-size: 0.95rem;
    transition: border-color 0.2s ease;
}

.form-control:focus {
    outline: none;
    border-color: var(--nc-scan);
    box-shadow: 0 0 0 2px var(--nc-scan-dim);
}

.form-control::placeholder { color: var(--nc-muted); }

.biometric-scanner { position: relative; margin: 0.5rem 0; }

.scanner-animation {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--nc-line);
    background: var(--nc-void);
}

.webcam-feed {
    width: 100%;
    display: block;
    height: auto;
    transform: scaleX(-1);
}

.scanner-animation.captured { box-shadow: 0 0 0 3px var(--nc-success); }

.nc-corner {
    position: absolute;
    width: 18px; height: 18px;
    border: 2px solid var(--nc-scan);
    opacity: 0.85;
}
.nc-corner.tl { top: 8px; left: 8px; border-right: none; border-bottom: none; }
.nc-corner.tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
.nc-corner.bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }
.nc-corner.br { bottom: 8px; right: 8px; border-left: none; border-top: none; }

.face-outline {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
}

.face-outline::before {
    content: '';
    position: absolute;
    width: 70%; height: 70%;
    border: 2px dashed var(--nc-scan);
    opacity: 0.5;
    border-radius: 50%;
    animation: pulse 2s infinite;
}

.scanning-beam {
    position: absolute;
    top: -10%; left: 10%;
    width: 80%; height: 8px;
    background: linear-gradient(to bottom,
        rgba(79, 209, 197, 0),
        rgba(79, 209, 197, 0.9),
        rgba(79, 209, 197, 0));
    border-radius: 10px;
    filter: blur(1px);
    z-index: 2;
    transition: top 2s linear;
}

.neu-button {
    padding: 0.9rem;
    background: var(--nc-scan);
    border: none;
    border-radius: 10px;
    color: var(--nc-void);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    cursor: pointer;
    transition: opacity 0.2s ease, transform 0.1s ease;
}

.neu-button:hover { opacity: 0.85; }
.neu-button:active { transform: scale(0.98); }
.neu-button svg { width: 18px; height: 18px; }

.btn-block { width: 100%; margin-top: 0.5rem; }

.webcam-hint {
    font-size: 0.78rem;
    color: var(--nc-muted);
    text-align: center;
    margin-top: 0.8rem;
}

.auth-footer {
    text-align: center;
    margin-top: 1.4rem;
    font-size: 0.88rem;
    color: var(--nc-muted);
}

.auth-link {
    color: var(--nc-scan);
    text-decoration: none;
    font-weight: 500;
}
.auth-link:hover { text-decoration: underline; }

.status-message { margin-top: 1.3rem; }

.alert {
    padding: 0.9rem 1.1rem;
    border-radius: 10px;
    margin-bottom: 1rem;
    background: var(--nc-panel-hi);
    border: 1px solid var(--nc-line);
    color: var(--nc-text);
    font-size: 0.88rem;
}

.alert-info { border-left: 3px solid var(--nc-scan); }
.alert-success { border-left: 3px solid var(--nc-success); }
.alert-error { border-left: 3px solid var(--nc-danger); }

.toast {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 0.9rem 1.3rem;
    border-radius: 10px;
    color: #fff;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.82rem;
    z-index: 1000;
    animation: slideIn 0.3s ease;
}

.toast-success { background-color: var(--nc-success); }
.toast-error { background-color: var(--nc-danger); }

.fade-out { animation: fadeOut 0.5s ease forwards; }

.particles-container {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
}
.nc-credit {
    position: fixed;
    bottom: 1rem;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--nc-muted);
    opacity: 0.7;
    z-index: 15;
}
.nc-credit strong { color: var(--nc-scan); font-weight: 500; }

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
    0% { transform: scale(0.98); opacity: 0.4; }
    50% { transform: scale(1.02); opacity: 0.8; }
    100% { transform: scale(0.98); opacity: 0.4; }
}

@keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}

@keyframes fadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
    .face-outline::before, .scanning-beam { animation: none; }
}

@media (max-width: 600px) {
    .glassmorphism-card { padding: 1.5rem; }
    .auth-title { font-size: 1.4rem; }
}
</style>
